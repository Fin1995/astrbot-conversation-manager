[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-conversation-manager"
version = "1.1.0"
description = "Browse, edit, and import AstrBot conversation data safely."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fin1995" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
astrbot-conversation-manager = "astrbot_conversation_manager.app:main"

[project.urls]
Repository = "https://github.com/Fin1995/astrbot-conversation-manager"
Issues = "https://github.com/Fin1995/astrbot-conversation-manager/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["astrbot_conversation_manager"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
